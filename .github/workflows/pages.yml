# Publishes the browser-only arena to https://tilt.github.io/llm_arena/
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:  # from board.yml after a board build
    inputs:
      ref:
        description: the app commit to build (board.yml passes main, so a board deploy never ships an older app)
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the engine wheel and conformance vectors
        run: make web-engine
      - name: Build the web UI for the Pages path
        run: cd web && npm ci && npm run build
        env:
          ARENA_BASE: /llm_arena/
      - name: Add the claims board (board-data may not exist before launch)
        run: |
          if git fetch -q --depth=1 origin board-data && git show FETCH_HEAD:board/board.json > web/dist/board.json; then
            echo "board.json: $(wc -c < web/dist/board.json) bytes"
          else
            rm -f web/dist/board.json
            echo "no board yet"
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

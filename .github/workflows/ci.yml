name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install
        run: uv sync --all-extras --python 3.12
      - name: Validate (ruff, format, mypy --strict, import-linter contracts)
        run: make validate
      - name: Tests (incl. contracts freshness; no model servers or keys needed)
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: cd web && npm ci
      - name: Types from contracts, svelte-check, vitest
        run: make test-web
      - name: Fail if generated types are stale
        run: git diff --exit-code web/src/lib/contracts.ts

  browser-isolation:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies and pinned browser engines
        run: cd web && npm ci && npx playwright install chromium firefox webkit
      - name: Prove opaque-origin browser isolation assumptions
        run: cd web && npx playwright test isolation.spec.ts

  claim-e2e:
    # The shared-claim loop on the built site with the real Pyodide engine (GitHub and OpenAI are mocked).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the engine wheel and the site
        run: uv sync --all-extras --python 3.12 && make web-engine && cd web && npm ci && npm run build
      - name: Install Chromium
        run: cd web && npx playwright install --with-deps chromium
      - name: Claim link → Beat this → post → counted
        run: cd web && npm run test:claim
      - name: Claims board renders before the engine, phone layout, axe scan
        run: cd web && npm run test:board
      - name: Color contrast on the main routes, light and dark (axe)
        run: cd web && npm run test:a11y

  board:
    # The claims board workflows: lint, the "only board.yml writes board-data" rule, and an offline dry run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: actionlint (pinned)
        run: uvx --from actionlint-py==1.7.12.25 actionlint
      - name: Only board.yml may push board-data
        run: |
          offenders=$(grep -l "board-data" .github/workflows/*.yml | grep -v -e board.yml -e pages.yml -e ci.yml || true)
          if [ -n "$offenders" ]; then echo "board-data is written only by board.yml: $offenders"; exit 1; fi
          # the [g] keeps the pattern from matching this check's own line
          if grep -n "[g]it push" .github/workflows/pages.yml .github/workflows/ci.yml; then exit 1; fi
      - name: Dry run without GitHub
        run: |
          uv sync --extra server --python 3.12
          mkdir -p "$RUNNER_TEMP/board-data"
          uv run arena board run --data "$RUNNER_TEMP/board-data" --actions "$RUNNER_TEMP/actions.json" --offline
          test -s "$RUNNER_TEMP/board-data/board/board.json"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
